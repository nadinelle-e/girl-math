<!DOCTYPE html>
<!--
  girl math — dein konfrontativer Finanzplaner.
  Diese Datei beschreibt nur den AUFBAU der Seite (welche Bereiche es gibt).
  Das Aussehen steckt in styles.css, die Logik (Rechnen, Speichern) in app.js.
  Die meisten Inhalte werden von app.js zur Laufzeit hier hineingeschrieben.
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- Sorgt dafür, dass die Seite auf dem Handy korrekt skaliert -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>girl math</title>

  <!--
    Das Symbol im Browser-Tab (Favicon).

    Der lange Buchstabensalat unten IST die Zeichnung — ein Bild, in
    Text übersetzt, damit keine extra Bilddatei nötig ist. Er muss
    „adressgerecht" geschrieben sein: %3C steht für <, %22 für ",
    %20 für ein Leerzeichen, %23 für #. In Klartext gelesen steht da:

      <svg viewBox="0 0 100 100">
        <rect width="100" height="100" rx="24" fill="#FDFAF5"/>
        <text x="51" y="58" text-anchor="middle" font-family="Georgia, serif"
              font-size="60" font-weight="700" font-style="italic">
          <tspan fill="#6B4226">g</tspan><tspan fill="#FF2D78">m</tspan>
        </text>
      </svg>

    Also: perlweiße Kachel mit runden Ecken, darauf das Monogramm „gm"
    — g in Warmbraun, m in Pink. Der Ring fehlt hier bewusst, denn im
    Tab ist das Bild nur etwa 16 Pixel groß und er wäre ein Krümel.

    Wichtig: Dieser Verweis muss FEST hier stehen. Setzt man ihn erst
    später per JavaScript, ignoriert Safari ihn komplett und sucht
    stattdessen eine Datei namens favicon.ico.
  -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2224%22%20fill%3D%22%23FDFAF5%22%2F%3E%3Ctext%20x%3D%2251%22%20y%3D%2258%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2C%20serif%22%20font-size%3D%2260%22%20font-weight%3D%22700%22%20font-style%3D%22italic%22%3E%3Ctspan%20fill%3D%22%236B4226%22%3Eg%3C%2Ftspan%3E%3Ctspan%20fill%3D%22%23FF2D78%22%3Em%3C%2Ftspan%3E%3C%2Ftext%3E%3C%2Fsvg%3E" />

  <!--
    Das Symbol für den Startbildschirm auf dem HANDY.

    Warum nochmal extra: Der Verweis oben ist ein SVG, das direkt in der
    Adresse steckt — ohne eigene Bilddatei. Rechner kommen damit klar,
    Handys nicht. Beide verlangen echte Bilddateien, jedes auf seinem Weg:

      iPhone   schaut ausschließlich nach „apple-touch-icon" und will ein
               PNG. Findet es keins, fotografiert iOS die Seite und nimmt
               das Foto als Symbol.
      Android  holt sein Symbol aus dem „manifest" — einem Steckbrief der
               App (Name, Farben, Bilder in 192 und 512 Pixel). Ohne den
               malt Chrome einen grauen Kreis mit einem „g" darin.

    Die Bilder liegen als apple-touch-icon.png, icon-192.png und
    icon-512.png neben dieser Datei. Sie zeigen den Ring mit „gm" — hier
    MIT Ring, anders als im Tab-Symbol, denn hier ist Platz dafür.

    Das ?v=1 ist derselbe Versionsstempel-Trick wie unten. Handys merken
    sich App-Symbole besonders hartnäckig: Ändert sich das Logo, muss die
    Zahl hoch, sonst klebt bei allen das alte Bild auf dem Bildschirm.

    theme-color färbt auf Android die Statusleiste oben in Perlweiß, damit
    sie nicht als schwarzer Balken über der Seite sitzt.
  -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" />
  <link rel="manifest" href="manifest.webmanifest?v=1" />
  <meta name="theme-color" content="#FDFAF5" />
  <meta name="apple-mobile-web-app-title" content="girl math" />

  <!--
    Das ?v=20 hinter dem Dateinamen ist ein Versionsstempel.

    Warum: Browser legen Dateien für eine Weile beiseite, statt sie jedes Mal
    neu zu holen. Nach einem Update sähe man deshalb bis zu zehn Minuten lang
    noch die alte Fassung. Für den Browser ist "styles.css?v=23" aber eine
    andere Adresse als "styles.css?v=19" — also holt er sie sofort frisch.

    ➜ WICHTIG: Bei jeder Änderung an styles.css oder app.js die Zahl an BEIDEN
      Stellen um eins hochzählen (unten beim <script> steht dieselbe). Vergisst
      man es, ist nichts kaputt, es dauert nur wieder bis zu zehn Minuten.
  -->
  <link rel="stylesheet" href="styles.css?v=23" />
</head>
<body>
  <!-- Die Leiste, die beim Scrollen oben kleben bleibt: Kontostand, Ausnahmen-
       Prozente und der Tag im Gehaltszyklus. Sie steht bewusst AUSSERHALB von
       .wrap, damit sie über die volle Breite geht.
       Wird von app.js gefüllt (renderStand). -->
  <div id="stand"></div>

  <!-- Der Balken, der erscheint, während ein abgeschlossener Monat zum
       Korrigieren offen ist. Alles darunter zeigt dann diesen alten Monat,
       und das muss man sehen, bevor man etwas eintippt.
       Wird von app.js gefüllt (renderBearbeitung) und ist sonst leer. -->
  <div id="bearbeitung"></div>

  <div class="wrap">

    <!-- Kopfzeile: Titel + aktueller Monat + großer Konsumopfer-Status.
         Wird von app.js gefüllt (renderKopf). -->
    <header id="kopf"></header>

    <!-- Die Serie: wie viele Monate in Folge du im Rahmen geblieben bist.
         Bleibt leer, solange noch kein Monat abgeschlossen ist.
         Wird von app.js gefüllt (renderSerie). -->
    <section id="serie"></section>

    <!-- Der Gehaltszyklus: Tag X von Y, Tage bis zum nächsten Gehalt und der
         Tempo-Vergleich zwischen verstrichener Zeit und ausgegebenem Geld.
         Der Zyklus läuft von Gehalt zu Gehalt, nicht von Monatsanfang bis
         Monatsende, und startet per Knopf.
         Wird von app.js gefüllt (renderZyklus). -->
    <section id="zyklus"></section>

    <!-- Alle Eingabe-Kategorien (Einnahmen, Fixkosten, Abos, Versicherungen,
         Einkauf, Ausnahmen, Sparen).
         Wird von app.js gefüllt (renderKategorien). -->
    <section id="kategorien"></section>

    <!-- Warnung vor nicht-monatlichen Zahlungen (vierteljährlich, jährlich):
         was diesen Monat zusätzlich abgeht und was bald kommt.
         Wird von app.js gefüllt (renderFaellig) und bleibt leer, wenn es
         nichts zu warnen gibt. -->
    <section id="faellig"></section>

    <!-- Kündigungs-Blick: alle Abos und Versicherungen nach JAHRESkosten
         sortiert, damit „nur 20 € im Monat" auffliegt.
         Wird von app.js gefüllt (renderVertraege). -->
    <section id="vertraege"></section>

    <!-- Kontostand-Bereich: Startguthaben eingeben + errechneter aktueller Stand.
         Wird von app.js gefüllt (renderKonto). -->
    <section id="konto"></section>

    <!-- Monats-Übersicht: Kreisdiagramm, Prozente, Rangliste der teuersten
         Ausnahmen, Realitäts-Check.
         Wird von app.js gefüllt (renderUebersicht). -->
    <section id="uebersicht"></section>

    <!-- Der Notwendig-Blick: jeder Posten, der als notwendig zählt, einzeln —
         mit dem Vermerk, ob die Kategorie das entschieden hat oder ein Häkchen
         von dir. Darunter, was ein Stand über 50% konkret kostet.
         Wird von app.js gefüllt (renderNotwendig). -->
    <section id="notwendig"></section>

    <!-- Gespart: eine Summe, und die Sparziele, an denen sie sich misst. Hier
         standen einmal zwei Karten (Notgroschen und Sparziel) mit getrennten
         Töpfen; den selbst gerechneten Notgroschen gibt es nicht mehr.
         Wird von app.js gefüllt (renderSparen). -->
    <section id="sparen"></section>

    <!-- Wohlstand, der in mein Leben fließt: alles, was dir ohne Anlass und
         ohne Gegenleistung zugefallen ist. Zählt bewusst NEBEN der großen
         Rechnung mit und geht in keine einzige ihrer Zahlen ein.
         Wird von app.js gefüllt (renderZufluss). -->
    <section id="zufluss"></section>

    <!-- Affirmationen: der aufbauende Gegenpol zum Verdikt oben.
         Wechselt einmal am Tag von allein, eigene Sätze lassen sich
         hinzufügen und löschen.
         Wird von app.js gefüllt (renderAffirmation). -->
    <section id="affirmation"></section>

    <!-- Werkzeugleiste: Monat abschließen, Sichern (Export), Laden (Import). -->
    <div class="werkzeuge">
      <button id="btn-monat-abschliessen" class="btn btn-stark">Monat abschließen</button>
      <button id="btn-export" class="btn">Sicherung speichern</button>
      <!-- Für den Import brauchen wir ein verstecktes Datei-Auswahlfeld,
           das der Button per Klick auslöst. -->
      <button id="btn-import" class="btn">Sicherung laden</button>
      <input id="import-datei" type="file" accept="application/json" hidden />
    </div>

    <!-- Der eine Satz, den man nicht sehen kann: dass die Zahlen nur in diesem
         Browser liegen. Alles andere sagen die Knöpfe selbst. -->
    <p class="werkzeuge-hinweis">
      Deine Zahlen liegen nur in diesem Browser. Ohne <strong>Sicherung</strong> sind sie weg,
      sobald du den Verlauf löschst oder das Gerät wechselst.
    </p>

    <!-- Archiv: die abgeschlossenen Monate, jeder nur mit seinem Namen. Ein
         Tipp darauf öffnet PDF und Bearbeiten.
         Wird von app.js gefüllt (renderArchiv). -->
    <section id="archiv"></section>

    <footer class="fuss">
      <p>girl math · deine Zahlen bleiben nur in diesem Browser · niemand sieht sie außer dir</p>
    </footer>
  </div>

  <!-- Das Willkommens-Fenster beim allerersten Besuch. Liegt außerhalb von
       .wrap, weil es sich über die ganze Seite legt.
       Wird von app.js gefüllt (renderModal) und ist sonst leer. -->
  <div id="modal"></div>

  <!-- Der kurze Einwurf, wenn du eine Ausnahme eintippst. Liegt am unteren
       Bildschirmrand und verschwindet nach ein paar Sekunden von allein.
       Wird von app.js gefüllt (zeigeReaktion). -->
  <div id="toast" aria-live="polite"></div>

  <!-- Der Monatsbericht. Am Bildschirm ist dieser Bereich unsichtbar; er
       taucht NUR beim Drucken auf, und dann als einzige Seite.
       Ein eigenes PDF-Programm brauchen wir dafür nicht: Der Browser kann
       jede Seite als PDF sichern, wir geben ihm über styles.css nur eine
       saubere Druckfassung vor.
       Wird von app.js gefüllt (renderBericht). -->
  <section id="bericht"></section>

  <!-- Die Logik ganz am Ende laden, damit die Bereiche oben schon existieren. -->
  <!-- Die Zahl hier muss dieselbe sein wie oben beim Stylesheet. -->
  <script src="app.js?v=23"></script>
</body>
</html>
